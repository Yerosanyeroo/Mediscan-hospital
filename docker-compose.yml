version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: mediscan-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mediscan
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - mediscan-network

  redis:
    image: redis:7-alpine
    container_name: mediscan-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - mediscan-network

  backend:
    build: ./backend
    container_name: mediscan-api
    restart: always
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mediscan:${MONGO_PASSWORD}@mongodb:27017/mediscan?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
      - redis
    networks:
      - mediscan-network

  nginx:
    image: nginx:alpine
    container_name: mediscan-nginx
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./frontend:/usr/share/nginx/html
      - ./ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - mediscan-network

volumes:
  mongo_data:
  redis_data:

networks:
  mediscan-network:
    driver: bridge